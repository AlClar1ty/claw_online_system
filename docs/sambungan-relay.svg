<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820">
  <rect width="1280" height="820" fill="#f6f3ec"/>
  <text x="48" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" fill="#1c1915">Sambungan Pi 3 ke relay 2 kanal</text>
  <text x="48" y="82" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#5e584e">Tiga kawat dari header, kanal 1 saja. Ujung header yang dipakai adalah ujung dekat slot microSD.</text>

  <rect x="40" y="110" width="500" height="500" rx="18" fill="#ffffff" stroke="#ddd4c6"/>
  <text x="64" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1c1915">Raspberry Pi 3</text>
  <text x="64" y="176" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#5e584e">Kiri = sisi dalam papan. Kanan = tepi luar.</text>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1c1915">
    <rect x="64" y="200" width="210" height="46" rx="8" fill="#fff6ea" stroke="#e0b15c"/>
    <text x="80" y="229">Pin 1 ? 3,3 V</text>
    <rect x="290" y="200" width="210" height="46" rx="8" fill="#fdecea" stroke="#d4534a"/>
    <circle cx="314" cy="223" r="8" fill="#d1242f"/>
    <text x="332" y="229" font-weight="700">Pin 2 ? 5 V</text>

    <rect x="64" y="258" width="210" height="40" rx="8" fill="#f4f1ea"/>
    <text x="80" y="284">Pin 3</text>
    <rect x="290" y="258" width="210" height="40" rx="8" fill="#f4f1ea"/>
    <text x="306" y="284">Pin 4</text>

    <rect x="64" y="310" width="210" height="40" rx="8" fill="#f4f1ea"/>
    <text x="80" y="336">Pin 5</text>
    <rect x="290" y="310" width="210" height="46" rx="8" fill="#efefef" stroke="#222"/>
    <circle cx="314" cy="333" r="8" fill="#222"/>
    <text x="332" y="339" font-weight="700">Pin 6 ? GND</text>

    <rect x="64" y="368" width="210" height="40" rx="8" fill="#f4f1ea"/>
    <text x="80" y="394">Pin 7</text>
    <rect x="290" y="368" width="210" height="40" rx="8" fill="#f4f1ea"/>
    <text x="306" y="394">Pin 8</text>

    <rect x="64" y="420" width="210" height="40" rx="8" fill="#efefef"/>
    <text x="80" y="446">Pin 9 ? GND</text>
    <rect x="290" y="420" width="210" height="40" rx="8" fill="#f4f1ea"/>
    <text x="306" y="446">Pin 10</text>

    <rect x="64" y="472" width="436" height="52" rx="8" fill="#e8f6ec" stroke="#1b7f3a"/>
    <circle cx="88" cy="498" r="8" fill="#1b7f3a"/>
    <text x="108" y="504" font-weight="700">Pin 11 ? BCM 17 ? ke IN1</text>
  </g>
  <text x="64" y="570" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#5e584e">Pin 12 dan seterusnya tidak dipakai.</text>

  <rect x="760" y="110" width="470" height="500" rx="18" fill="#ffffff" stroke="#ddd4c6"/>
  <text x="784" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1c1915">Relay Songle 2 kanal</text>
  <text x="784" y="176" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#5e584e">Jumper RY-VCC ke VCC tetap terpasang.</text>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1c1915">
    <rect x="784" y="200" width="210" height="46" rx="8" fill="#fdecea" stroke="#d4534a"/>
    <text x="800" y="229" font-weight="700">VCC</text>
    <rect x="1006" y="200" width="190" height="46" rx="8" fill="#efefef" stroke="#222"/>
    <text x="1022" y="229" font-weight="700">GND</text>
    <rect x="784" y="260" width="412" height="46" rx="8" fill="#e8f6ec" stroke="#1b7f3a"/>
    <text x="800" y="289" font-weight="700">IN1 ? kanal yang dipakai</text>
    <rect x="784" y="318" width="412" height="40" rx="8" fill="#f4f1ea"/>
    <text x="800" y="344">IN2 ? tidak disambung</text>
  </g>

  <text x="784" y="392" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#1c1915">Sekrup kanal 1</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1c1915">
    <rect x="784" y="408" width="412" height="40" rx="8" fill="#f4f1ea"/>
    <text x="800" y="434">NC ? kosong</text>
    <rect x="784" y="458" width="412" height="46" rx="8" fill="#fff8df" stroke="#c4a35a"/>
    <text x="800" y="487" font-weight="700">COM ? kawat sinyal koin</text>
    <rect x="784" y="514" width="412" height="46" rx="8" fill="#fff8df" stroke="#c4a35a"/>
    <text x="800" y="543" font-weight="700">NO ? kawat sinyal koin</text>
  </g>
  <text x="784" y="586" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#5e584e">Sekrup tengah biasanya COM. Cocokkan dengan cetakan di papan.</text>

  <path d="M500 223 H640 V223 H784" fill="none" stroke="#d1242f" stroke-width="6"/>
  <path d="M500 333 H620 V223 H1006" fill="none" stroke="#222" stroke-width="6"/>
  <path d="M500 498 H660 V283 H784" fill="none" stroke="#1b7f3a" stroke-width="6"/>

  <rect x="40" y="640" width="1190" height="140" rx="18" fill="#ffffff" stroke="#ddd4c6"/>
  <text x="64" y="680" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#1c1915">Cara membaca</text>
  <text x="64" y="712" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1c1915">Merah: pin 2 ke VCC. Hitam: pin 6 ke GND. Hijau: pin 11 ke IN1. COM dan NO ke dua kawat koin. NC dan IN2 kosong.</text>
  <text x="64" y="742" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1c1915">Relay ini menutup kontak saat IN1 berlevel LOW, sekitar 80 ms tiap main. Saat diam, pin 11 berlevel HIGH.</text>
</svg>
